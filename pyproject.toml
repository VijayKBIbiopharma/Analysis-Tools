[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-tools"
version = "0.1.0"
description = "Statistics, design of experiments and machine learning for process and product development"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "scikit-learn==1.5.2",
    "streamlit==1.40.2",
]

[tool.setuptools.packages.find]
include = ["analysis_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
